[testenv:bootstrap]
deps =
    jinja2
    tox
skip_install = true
commands =
    python ci/bootstrap.py --no-env
passenv =
    *

; a generative tox configuration, see: https://tox.wiki/en/latest/user_guide.html#generative-environments
[tox]
isolated_build = true
envlist =
    clean,
    check,
    docs,
    {py310,py311,py312,py313,py314,py315,pypy310,pypy311}-{pytest90}-{xdist38}-{coverage713},
    report
ignore_basepython_conflict = true

[testenv]
extras = testing
setenv =
    PYTHONPATH={toxinidir}/tests
    PYTHONUNBUFFERED=yes

    # Use env vars for (optional) pinning of deps.
    pytest90:  _DEP_PYTEST=pytest==9.0.2

    xdist38: _DEP_PYTESTXDIST=pytest-xdist==3.8.0
    xdistdev: _DEP_PYTESTXDIST=git+https://github.com/pytest-dev/pytest-xdist.git#egg=pytest-xdist

    coverage713: _DEP_COVERAGE=coverage==7.13.5

    # For testing against a coverage.py working tree.
    coveragedev: _DEP_COVERAGE=-e{env:COVERAGE_HOME}
passenv =
    *
deps =
    {env:_DEP_PYTEST:pytest}
    {env:_DEP_PYTESTXDIST:pytest-xdist}
    {env:_DEP_COVERAGE:coverage}
    celery[redis]
    testcontainers[redis]
pip_pre = true
commands =
    {posargs:pytest -vv}

[testenv:check]
deps =
    docutils
    twine
    uv
    prek
skip_install = true
commands =
    uv build --sdist --wheel
    twine check --strict dist/*
    prek run --all-files --show-diff-on-failure

[testenv:docs]
usedevelop = true
deps =
    -r{toxinidir}/docs/requirements.txt
commands =
    sphinx-build {posargs:-E} -b html docs dist/docs
    sphinx-build -b linkcheck docs dist/docs

[testenv:report]
deps =
    coverage
skip_install = true
commands =
    coverage report
    coverage html

[testenv:clean]
commands = coverage erase
skip_install = true
deps =
    coverage
